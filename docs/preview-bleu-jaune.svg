<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Dégradé exact de .summer-ffa-card (globals.css) -->
    <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="220">
      <stop offset="0"    stop-color="#1e3a8a"/>
      <stop offset="0.42" stop-color="#1d4ed8"/>
      <stop offset="0.64" stop-color="#3b82f6"/>
      <stop offset="1"    stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="glow" cx="396" cy="-26" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="0.08" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="0.30" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="-29" cy="253" r="396" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#172554" stop-opacity="0.62"/>
      <stop offset="0.12" stop-color="#172554" stop-opacity="0.62"/>
      <stop offset="0.41" stop-color="#172554" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="760" height="500" fill="#eef2f7"/>

  <text x="30" y="42" font-size="22" font-weight="800" fill="#0f172a">Aperçu : icône nucléaire ☢ + bannière bleu/jaune</text>

  <!-- Icône seule, couleur accent du thème (titre de série) -->
  <g transform="translate(60,150)">
    <g fill="#c95d0c">
      <path d="M12 10.1a1.9 1.9 0 1 0 0 3.8a1.9 1.9 0 1 0 0-3.8Z"/>
      <path d="M12.83 10.29 L16.21 3.37 A9.6 9.6 0 0 0 7.79 3.37 L11.17 10.29 A1.9 1.9 0 0 1 12.83 10.29 Z"/>
      <path d="M13.9 12.13 L21.58 12.67 A9.6 9.6 0 0 1 17.37 19.96 L13.06 13.58 A1.9 1.9 0 0 0 13.9 12.13 Z"/>
      <path d="M10.1 12.13 L2.42 12.67 A9.6 9.6 0 0 0 6.63 19.96 L10.94 13.58 A1.9 1.9 0 0 1 10.1 12.13 Z"/>
    </g>
    <text x="-18" y="150" font-size="15" font-weight="700" fill="#334155">Icône 64px — accent orange (titre de série)</text>
  </g>

  <!-- Icône blanche sur dégradé bleu/jaune (marque sur la bannière) -->
  <g transform="translate(300,66)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="url(#main)"/>
    <g transform="translate(43,43) scale(2.6667)" fill="#ffffff" opacity="0.55">
      <path d="M12 10.1a1.9 1.9 0 1 0 0 3.8a1.9 1.9 0 1 0 0-3.8Z"/>
      <path d="M12.83 10.29 L16.21 3.37 A9.6 9.6 0 0 0 7.79 3.37 L11.17 10.29 A1.9 1.9 0 0 1 12.83 10.29 Z"/>
      <path d="M13.9 12.13 L21.58 12.67 A9.6 9.6 0 0 1 17.37 19.96 L13.06 13.58 A1.9 1.9 0 0 0 13.9 12.13 Z"/>
      <path d="M10.1 12.13 L2.42 12.67 A9.6 9.6 0 0 0 6.63 19.96 L10.94 13.58 A1.9 1.9 0 0 1 10.1 12.13 Z"/>
    </g>
    <text x="-45" y="185" font-size="15" font-weight="700" fill="#334155">Icône blanche sur bannière</text>
  </g>

  <!-- Carte bannière factice façon TournamentsView -->
  <g transform="translate(60,250)">
    <rect x="0" y="0" width="360" height="200" rx="16" fill="url(#main)"/>
    <rect x="0" y="0" width="360" height="200" rx="16" fill="url(#glow)"/>
    <rect x="0" y="0" width="360" height="200" rx="16" fill="url(#shade)"/>
    <rect x="0.5" y="0.5" width="359" height="199" rx="16" fill="none" stroke="#1d4ed8" stroke-width="1"/>

    <!-- marque radiation en bas à droite -->
    <g transform="translate(318,158) rotate(-14) scale(2.2)" fill="#ffffff" opacity="0.3">
      <path d="M12 10.1a1.9 1.9 0 1 0 0 3.8a1.9 1.9 0 1 0 0-3.8Z"/>
      <path d="M12.83 10.29 L16.21 3.37 A9.6 9.6 0 0 0 7.79 3.37 L11.17 10.29 A1.9 1.9 0 0 1 12.83 10.29 Z"/>
      <path d="M13.9 12.13 L21.58 12.67 A9.6 9.6 0 0 1 17.37 19.96 L13.06 13.58 A1.9 1.9 0 0 0 13.9 12.13 Z"/>
      <path d="M10.1 12.13 L2.42 12.67 A9.6 9.6 0 0 0 6.63 19.96 L10.94 13.58 A1.9 1.9 0 0 1 10.1 12.13 Z"/>
    </g>

    <text x="22" y="34" font-size="12" fill="#ffffff" opacity="0.8">12 juil. 2026</text>
    <text x="22" y="62" font-size="18" font-weight="800" fill="#ffffff">2026 Summer FFA Minor #4</text>

    <rect x="22" y="76" width="42" height="20" rx="6" fill="#ffffff" opacity="0.18"/>
    <text x="32" y="90" font-size="11" font-weight="700" fill="#ffffff">FFA</text>
    <rect x="70" y="76" width="46" height="20" rx="6" fill="#ffffff" opacity="0.18"/>
    <text x="80" y="90" font-size="11" font-weight="700" fill="#ffffff">Minor</text>

    <text x="22" y="168" font-size="12" fill="#ffffff" opacity="0.85">120 participants</text>
    <text x="280" y="168" font-size="12" font-weight="700" fill="#ffffff">🏆 Glowzzy</text>
  </g>

  <text x="60" y="485" font-size="13" fill="#64748b">Dégradé : linear-gradient(135deg, #1e3a8a → #1d4ed8 → #3b82f6 → #fde047) — bordure #1d4ed8, ombre bleue.</text>
</svg>
